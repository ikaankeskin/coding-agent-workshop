[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-harness"
version = "0.1.0"
description = "A coding agent harness with a tool loop, context compression, and OpenJev decisions."
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",
    "anthropic>=0.39",
]

[project.scripts]
harness = "harness.cli:main"

[tool.setuptools.packages.find]
include = ["harness*"]
